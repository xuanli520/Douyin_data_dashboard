login_recipe:
  entrypoint: https://fxg.jinritemai.com/login/common
  steps:
    - id: fill_phone
      action: fill
      target: 手机号码
      locators:
        - role: spinbutton
          name: 手机号码
        - css: "input[placeholder*='手机号']"
        - text: 手机号码
      value_from: phone
    - id: send_code
      action: click
      target: 发送验证码
      locators:
        - css: button.get-code-btn
        - text: 获取验证码
        - text: 发送验证码
    - id: request_code
      action: request_verification_code
    - id: fill_code
      action: fill
      target: 验证码
      locators:
        - role: spinbutton
          name: 验证码
        - css: "input[placeholder*='验证码']"
      value_from: code
    - id: submit_login
      action: click
      target: 登录按钮
      locators:
        - role: button
          name: 登录
        - css: button.login-btn
    - id: check_login
      action: check_login_status
