login_recipe:
  entrypoint: https://fxg.jinritemai.com/login/common
  steps:
    - id: fill_phone
      action: fill
      target: 手机号码
      locators:
        - css: "input[placeholder*='手机号']"
        - role: spinbutton
          name: 手机号码
        - text: 手机号码
      value_from: phone
    - id: send_code
      action: click
      target: 发送验证码
      locators:
        - css: ".account-center-code-captcha.active"
        - text: 获取验证码
        - text: 发送验证码
    - id: request_code
      action: request_verification_code
    - id: fill_code
      action: fill
      target: 验证码
      locators:
        - css: "input[placeholder*='验证码']"
        - role: spinbutton
          name: 验证码
      value_from: code
    - id: refill_phone_before_submit
      action: fill
      target: 手机号码
      locators:
        - css: "input[placeholder*='手机号']"
        - role: spinbutton
          name: 手机号码
      value_from: phone
    - id: accept_doudian_policy
      action: check
      target: 抖店协议
      locators:
        - css: "input.auxo-checkbox-input"
    - id: submit_login
      action: click
      target: 登录按钮
      locators:
        - css: "button.account-center-action-button.active"
        - css: "button.account-center-action-button"
        - css: "button:has-text('登录')"
        - role: button
          name: 登录
        - css: button.login-btn
    - id: check_login
      action: check_login_status
